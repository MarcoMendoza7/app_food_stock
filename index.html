<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD-STOCK - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>App FOOD - STOCK</h1>
            <p>Gestión Web de Suministros Alimentarios</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario u Organismo</label>
                    <input type="text" id="username" required placeholder="Ej: admin_comedor">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="role">Selecciona tu Rol de Acceso</label>
                    <select id="role">
                        <option value="Administrador">Administrador (Gestión Total)</option>
                        <option value="Voluntario">Voluntario (Operativo Almacén)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Ingresar al Sistema</button>
            </form>
        </div>
    </div>

    <script src="js/navigation.js"></script>
</body>
</html>
