<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD-STOCK - Movimientos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="logo">FOOD - STOCK</div>
            <a href="dashboard.html">Panel Principal</a>
            <a href="inventario.html">Inventario (CRUD)</a>
            <a href="movimientos.html" class="active">Entradas / Salidas</a>
            <a href="#" class="logout-btn" onclick="logout()">Cerrar Sesión</a>
        </nav>

        <main class="main-content">
            <div class="header-panel">
                <h2>Registro de Entradas y Salidas de Almacén</h2>
            </div>

            <div class="table-container" style="max-width: 600px; margin-bottom: 2rem;">
                <h3 style="margin-bottom: 1rem;">Registrar Operación Diaria</h3>
                <form onsubmit="alert('Movimiento Guardado Exitosamente en Almacén'); return false;">
                    <div class="form-group">
                        <label>Tipo de Flujo</label>
                        <select required>
                            <option value="entrada">Entrada (Donación Recibida)</option>
                            <option value="salida">Salida (Consumo de Comedor / Merma)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Insumo / Producto</label>
                        <input type="text" placeholder="Ej: Arroz, Leche..." required>
                    </div>
                    <div class="form-group">
                        <label>Cantidad Exacta</label>
                        <input type="number" placeholder="Ej: 50" required>
                    </div>
                    <button type="submit" class="btn-primary">Guardar Registro Operativo</button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/navigation.js"></script>
</body>
</html>
